services:
  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    environment: { GATEWAY_URL: http://gateway:4000/graphql }
    ports: ["3000:3000"]
    depends_on: { gateway: { condition: service_started } }
  gateway:
    build: { context: ., dockerfile: infrastructure/docker/gateway.Dockerfile }
    environment:
      { API_URL: http://api:4001, OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318 }
    ports: ["4000:4000"]
    depends_on: [api]
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    environment: { OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318 }
    ports: ["4001:4001"]
  worker:
    build: { context: ., dockerfile: infrastructure/docker/worker.Dockerfile }
    environment:
      { REDIS_URL: redis://redis:6379, OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318 }
    depends_on: [redis]
  docs:
    build: { context: ., dockerfile: infrastructure/docker/docs.Dockerfile }
    ports: ["4321:80"]
  redis:
    image: redis:8-alpine
    profiles: [observability]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./infrastructure/observability/otel-collector.yml:/etc/otel/config.yml:ro"]
    ports: ["4317:4317", "4318:4318"]
    profiles: [observability]
  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    ports: ["16686:16686"]
    profiles: [observability]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    profiles: [observability]
  grafana:
    image: grafana/grafana:12.1.0
    volumes: ["./infrastructure/observability/grafana:/etc/grafana/provisioning:ro"]
    ports: ["3001:3000"]
    profiles: [observability]
