apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: doctrine-development, namespace: argocd }
spec:
  project: default
  source:
    {
      repoURL: https://github.com/example/overengineered.git,
      targetRevision: main,
      path: infrastructure/kustomize/overlays/development,
    }
  destination: { server: https://kubernetes.default.svc, namespace: doctrine-development }
  syncPolicy: { automated: { prune: true, selfHeal: true } }
