apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: doctrine-production, namespace: argocd }
spec:
  project: default
  source:
    {
      repoURL: https://github.com/example/overengineered.git,
      targetRevision: production,
      path: infrastructure/kustomize/overlays/production,
    }
  destination: { server: https://kubernetes.default.svc, namespace: doctrine-production }
