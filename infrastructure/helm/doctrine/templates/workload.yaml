apiVersion: v1
kind: ServiceAccount
metadata: { name: doctrine }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: { name: doctrine-config }
data:
  GATEWAY_URL: { { .Values.config.gatewayUrl | quote } }
  ENABLE_DOCTRINAL_FALLBACK: { { .Values.config.enableDoctrinalFallback | quote } }
---
apiVersion: v1
kind: Secret
metadata: { name: doctrine-secrets }
type: Opaque
stringData:
  OVERENGINEERED_PUBLIC_CONTENT_KILL_SWITCH: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: doctrine-web, labels: { app: doctrine-web } }
spec:
  replicas: { { .Values.replicaCount } }
  selector: { matchLabels: { app: doctrine-web } }
  template:
    metadata: { labels: { app: doctrine-web } }
    spec:
      serviceAccountName: doctrine
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: { { .Values.image.pullPolicy } }
          ports: [{ containerPort: 3000 }]
          envFrom:
            [{ configMapRef: { name: doctrine-config } }, { secretRef: { name: doctrine-secrets } }]
          startupProbe:
            { httpGet: { path: /api/health, port: 3000 }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 5 }
          resources: { { toYaml .Values.resources | nindent 12 } }
---
apiVersion: v1
kind: Service
metadata: { name: doctrine-web }
spec:
  selector: { app: doctrine-web }
  ports: [{ name: http, port: { { .Values.service.port } }, targetPort: 3000 }]
