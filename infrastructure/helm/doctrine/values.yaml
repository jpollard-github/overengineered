replicaCount: 2
image: { repository: ghcr.io/example/overengineered-web, tag: latest, pullPolicy: IfNotPresent }
service: { port: 3000 }
ingress: { enabled: false, className: nginx, host: doctrine.local, tlsSecret: doctrine-tls }
resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 70 }
config: { gatewayUrl: "http://gateway:4000/graphql", enableDoctrinalFallback: "true" }
canary: { enabled: false, weight: 5 }
